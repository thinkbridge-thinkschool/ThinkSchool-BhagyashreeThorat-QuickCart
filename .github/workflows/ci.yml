name: CI

on:
  push:
    branches: [ main, "Day-*" ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Build + Unit + Integration tests ──────────────────────────────────────
  test:
    name: Build, Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests (with coverage)
        run: |
          dotnet test tests/QuickCart.Tests \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/unit \
            --logger "trx;LogFileName=unit.trx"

      - name: Integration tests (with coverage)
        run: |
          dotnet test tests/QuickCart.IntegrationTests \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/integration \
            --logger "trx;LogFileName=integration.trx"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/coverage-report" \
            -reporttypes:"Html;Cobertura;TextSummary"

      - name: Print coverage summary
        run: cat TestResults/coverage-report/Summary.txt || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

  # ── E2E tests (Playwright) ─────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: test  # Only run E2E if unit + integration tests pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build
        run: dotnet build --configuration Release

      - name: Install Playwright browsers
        run: |
          cd tests/QuickCart.E2E
          dotnet build --configuration Release
          pwsh bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start QuickCart API
        run: |
          dotnet run \
            --project src/QuickCart.Api/QuickCart.Api.csproj \
            --configuration Release \
            --urls "http://0.0.0.0:5000" &
          # Wait until the catalog endpoint responds (up to 60 s)
          for i in $(seq 1 30); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:5000/api/v1/products)
            if [ "$STATUS" = "200" ]; then
              echo "API is ready after ${i}×2 s"
              break
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done

      - name: Run E2E tests
        run: |
          dotnet test tests/QuickCart.E2E \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=e2e.trx" \
            --results-directory TestResults/e2e
        env:
          E2E_BASE_URL: http://localhost:5000

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: TestResults/e2e/
