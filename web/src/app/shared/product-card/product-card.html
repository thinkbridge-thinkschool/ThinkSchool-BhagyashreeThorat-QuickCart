<div class="card product-card">
  <!-- Clicking the image navigates to the product detail page. -->
  <a
    [routerLink]="['/products', product().productId]"
    class="product-img-link"
    [attr.aria-label]="'View ' + product().productName">
    <img
      class="product-img"
      [src]="product().imageUrl || placeholder"
      (error)="onImgError($event)"
      [alt]="product().productName" />
  </a>

  <div class="product-body">
    @if (categoryName()) {
      <span class="badge cat">{{ categoryName() }}</span>
    }

    <!-- Clicking the name also navigates to the product detail page. -->
    <a [routerLink]="['/products', product().productId]" class="product-name-link">
      <strong class="product-name">{{ product().productName }}</strong>
    </a>

    <div class="spread product-foot">
      <strong class="product-price">{{ product().price | currency:'INR':'symbol':'1.0-0' }}</strong>
      <button
        class="btn-primary product-add-btn"
        [disabled]="!product().isAvailable"
        (click)="add()">
        {{ product().isAvailable ? 'Add' : 'Out of stock' }}
      </button>
    </div>
  </div>
</div>

@if (toast()) {
  <div class="toast">{{ toast() }}</div>
}
